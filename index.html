<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Church Presenter - Studio Pro</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-layout">
    
    <!-- LEFT PANEL: Templates Area & CP Mini Monitor -->
    <div class="left-panel">
      <h3>Templates Library</h3>
      
      <!-- Long Scrollable Template Bar (Landscape) - 60% height -->
      <label class="section-label">Templates (Landscape):</label>
      <div id="templateBar" class="template-bar-scrollable">
        <!-- Scrollable templates will be injected here -->
      </div>

      <hr class="divider">

      <!-- CP Portrait Screen at the Bottom -->
      <label class="section-label">CP Portrait Template View:</label>
      <div id="leftCpPreview" class="preview-screen portrait">
        <div class="preview-text">CP View...</div>
      </div>
    </div>

    <!-- CENTER PANEL: Studio Controller & Single Editor with Switch -->
    <div class="center-panel">
      <div class="panel-header">
        <h2>Studio Controller</h2>
        <div class="quick-links">
          <a href="display.html" target="_blank" class="btn link">Main Display</a>
          <a href="band.html" target="_blank" class="btn link">Band/CP View</a>
        </div>
      </div>

      <!-- Studio Mode Action Bar -->
      <div class="studio-action-bar">
        <button id="btnPushLive" class="btn transition-btn">PUSH TO LIVE (TRANSITION)</button>
        <button id="btnClear" class="btn warning">CLEAR</button>
        <button id="btnBlack" class="btn danger">BLACK</button>
      </div>

      <!-- Single Editing Screen with Main/CP Switch Button -->
      <div class="editor-container">
        <div class="editor-top-bar">
          <span id="editingModeLabel" class="section-label">EDITING: MAIN VIEW (LANDSCAPE)</span>
          <button id="btnSwitchView" class="btn primary">SWITCH TO CP VIEW</button>
        </div>
        
        <!-- Dynamic Editing Screen -->
        <div id="centerEditorScreen" class="preview-screen landscape editable-screen">
          <textarea id="centerEditorInput" placeholder="Type text here..."></textarea>
        </div>
      </div>
    </div>

    <!-- RIGHT PANEL: Live View Monitors -->
    <div class="right-panel">
      <div class="monitor-card">
        <div class="monitor-title">Live Main View (Landscape)</div>
        <div id="mainLivePreview" class="preview-screen landscape">
          <div class="preview-text"></div>
        </div>
      </div>

      <div class="monitor-card">
        <div class="monitor-title">Live CP View (Portrait)</div>
        <div id="cpLivePreview" class="preview-screen portrait">
          <div class="preview-text"></div>
        </div>
      </div>
    </div>

  </div>

  <script src="app.js"></script>
</body>
</html>
