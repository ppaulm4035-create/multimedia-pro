<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Church Presenter - Studio Pro</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-layout">
    
    <!-- LEFT PANEL: Song Library & Web Lyric Search -->
    <div class="left-panel">
      <h3>Song Library & Search</h3>
      
      <!-- Web Lyric Search Section -->
      <div class="search-box-section">
        <label class="section-label">Web Lyric Search:</label>
        <div class="search-input-group">
          <input type="text" id="webSearchInput" placeholder="Song title & artist...">
          <button id="searchWebBtn" class="btn primary">Search</button>
        </div>
        <div id="searchResults" class="search-results-list"></div>
      </div>

      <hr class="divider">

      <!-- Manual Song Builder -->
      <div class="song-form">
        <input type="text" id="songTitleInput" placeholder="Song Title...">
        <select id="partSelect">
          <option value="INTRO">INTRO</option>
          <option value="VERSE">VERSE</option>
          <option value="CHORUS">CHORUS</option>
          <option value="BRIDGE">BRIDGE</option>
          <option value="REFRAIN">REFRAIN</option>
          <option value="ADLIB">ADLIB</option>
          <option value="OUTRO">OUTRO</option>
        </select>
        <textarea id="partLyricsInput" rows="3" placeholder="Lyrics (Main Screen)"></textarea>
        <textarea id="partBandInput" rows="2" placeholder="Band/CP Chords (Optional)"></textarea>
        <button id="addPartBtn" class="btn primary">Add Part</button>
        <button id="saveSongBtn" class="btn success" style="margin-top: 5px;">Save Song</button>
      </div>

      <hr class="divider">
      <h4>Saved Songs</h4>
      <div id="songList" class="template-list"></div>
    </div>

    <!-- CENTER PANEL: Studio Mode (Preview vs Program Live) -->
    <div class="center-panel">
      <div class="panel-header">
        <h2>Studio Controller</h2>
        <div class="quick-links">
          <a href="display.html" target="_blank" class="btn link">Main Display</a>
          <a href="band.html" target="_blank" class="btn link">Band/CP View</a>
        </div>
      </div>

      <!-- Studio Mode Action Bar -->
      <div class="studio-action-bar">
        <button id="btnPushLive" class="btn transition-btn">PUSH TO LIVE (TRANSITION)</button>
        <button id="btnClear" class="btn warning">CLEAR</button>
        <button id="btnBlack" class="btn danger">BLACK</button>
      </div>

      <!-- Song Parts Triggers -->
      <label class="section-label">Song Parts (Synced Trigger):</label>
      <div id="songPartTriggers" class="parts-grid"></div>

      <!-- Dual Studio Editors: Preview (Workspace) vs Program (Live) -->
      <div class="studio-editors-grid">
        <div class="editor-column">
          <div class="editor-header preview-hdr">PREVIEW BUFFER (Edit here first)</div>
          <label class="section-label">Main Projector Preview:</label>
          <textarea id="previewMainInput" rows="4" placeholder="Drafting main lyrics..."></textarea>
          
          <label class="section-label" style="margin-top: 10px;">Band / CP Preview:</label>
          <textarea id="previewBandInput" rows="4" placeholder="Drafting band chords..."></textarea>
        </div>

        <div class="editor-column">
          <div class="editor-header live-hdr">PROGRAM LIVE (Currently on Screen)</div>
          <label class="section-label">Active Main Output:</label>
          <textarea id="liveMainDisplay" rows="4" readonly placeholder="Live projector output..."></textarea>
          
          <label class="section-label" style="margin-top: 10px;">Active Band Output:</label>
          <textarea id="liveBandDisplay" rows="4" readonly placeholder="Live band output..."></textarea>
        </div>
      </div>
    </div>

    <!-- RIGHT PANEL: Dual Monitor Previews -->
    <div class="right-panel">
      <div class="monitor-card">
        <div class="monitor-title">Main Monitor (Projector)</div>
        <div id="mainPreview" class="preview-screen landscape">
          <div class="preview-text"></div>
        </div>
      </div>

      <div class="monitor-card">
        <div class="monitor-title">Portrait CP Monitor</div>
        <div id="mobilePreview" class="preview-screen portrait">
          <div class="preview-text"></div>
        </div>
      </div>
    </div>

  </div>

  <script src="app.js"></script>
</body>
</html>
