<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multimedia Presenter</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <!-- Top Toolbar with GO LIVE Button -->
        <header class="top-toolbar">
            <h2>Multimedia Presenter</h2>
            <div class="action-buttons">
                <button id="btnGoLive" class="btn primary">🔴 GO LIVE (PUSH)</button>
                <button id="btnClear" class="btn warning">Clear</button>
                <button id="btnBlack" class="btn dark">Blackout</button>
            </div>
        </header>

        <!-- 2-Column Studio Workspace: Center Editor & Right Live Monitor -->
        <div class="workspace">
            <!-- Left / Center: Editing Screen (Master Source) -->
            <div class="editor-section">
                <div class="mode-label">EDITING SCREEN (WORKPLACE)</div>
                <div class="canvas-box">
                    <div id="centerEditor" class="editor-input" contenteditable="true" placeholder="Type presentation content here..."></div>
                </div>
            </div>

            <!-- Right Column: Live Monitor (Output Display) -->
            <div class="preview-panel">
                <div class="mode-label">LIVE MONITOR (OUTPUT)</div>
                <div class="canvas-box live-box">
                    <div id="livePreviewBox" class="editor-input"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
