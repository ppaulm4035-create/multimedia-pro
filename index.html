<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multimedia Presenter</title>
    <link rel="stylesheet" href="style.css">
    <!-- Include JSZip and Mammoth.js for reading PPTX and DOCX files -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
</head>
<body>
    <div class="app-container">
        <!-- Top Toolbar with Import File Button -->
        <header class="top-toolbar">
            <h2>Multimedia Presenter</h2>
            <div class="action-buttons">
                <!-- Hidden file input triggered by custom button -->
                <input type="file" id="fileImporter" accept=".pptx, .docx, .txt" style="display: none;">
                <button id="btnImport" class="btn primary">📁 Import File (PPTX / DOCX)</button>
                <button id="btnClear" class="btn warning">Clear</button>
                <button id="btnBlack" class="btn dark">Blackout</button>
            </div>
        </header>

        <!-- 3-Column Studio Workspace -->
        <div class="workspace">
            <!-- Left Column: Templates -->
            <div class="templates-sidebar">
                <h3>Templates</h3>
                <div id="templateBar" class="template-list"></div>
            </div>

            <!-- Center Column: Editing Screen (Main) -->
            <div class="editor-section">
                <div class="mode-label">EDITING SCREEN (MAIN)</div>
                <div class="canvas-box">
                    <textarea id="centerEditor" class="editor-input" placeholder="Paste or import your PowerPoint / Word project here..."></textarea>
                </div>
            </div>

            <!-- Right Column: Live Monitor -->
            <div class="preview-panel">
                <h3>Live Monitor</h3>
                <div class="preview-card">
                    <span>Main Display Output</span>
                    <div class="canvas-box live-box-small">
                        <div id="livePreviewBox" class="editor-output live-text-small"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
