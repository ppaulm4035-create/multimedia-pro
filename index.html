<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multimedia Presenter</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <!-- Top Toolbar -->
        <header class="top-toolbar">
            <h2>Multimedia Presenter</h2>
            <div class="action-buttons">
                <button id="btnClear" class="btn warning">Clear</button>
                <button id="btnBlack" class="btn dark">Blackout</button>
            </div>
        </header>

        <!-- Single Workspace for Editing Monitor -->
        <div class="workspace">
            <div class="editor-section">
                <div class="mode-label">TV MONITOR VIEW (16:9)</div>
                <div class="canvas-box">
                    <div id="centerEditor" class="editor-input" contenteditable="true" placeholder="Type presentation content here..."></div>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
