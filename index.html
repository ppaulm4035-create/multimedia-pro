<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Church Presenter - Pro Studio</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-layout">
    
    <!-- LEFT PANEL: Song Templates & Part Assigning -->
    <div class="left-panel">
      <h3>Song Library</h3>
      <div class="song-form">
        <input type="text" id="songTitleInput" placeholder="Song Title...">
        
        <label class="section-label">Add Part Content:</label>
        <select id="partSelect">
          <option value="INTRO">INTRO</option>
          <option value="VERSE">VERSE</option>
          <option value="CHORUS">CHORUS</option>
          <option value="BRIDGE">BRIDGE</option>
          <option value="REFRAIN">REFRAIN</option>
          <option value="ADLIB">ADLIB</option>
          <option value="OUTRO">OUTRO</option>
        </select>
        
        <textarea id="partLyricsInput" rows="4" placeholder="Lyrics (Main Screen)"></textarea>
        <textarea id="partBandInput" rows="3" placeholder="Band/CP Notes & Chords (Optional)"></textarea>
        <button id="addPartBtn" class="btn primary">Add/Update Part</button>
        <button id="saveSongBtn" class="btn success" style="margin-top: 5px;">Save Full Song</button>
      </div>

      <hr class="divider">

      <h4>Saved Songs</h4>
      <div id="songList" class="template-list"></div>
    </div>

    <!-- CENTER PANEL: Edit Mode, Global Part Triggers & Editors -->
    <div class="center-panel">
      <div class="panel-header">
        <h2>Studio Live Controller</h2>
        <div class="quick-links">
          <a href="display.html" target="_blank" class="btn link">Main Display</a>
          <a href="band.html" target="_blank" class="btn link">Band/CP View</a>
        </div>
      </div>

      <!-- Action Bar -->
      <div class="action-bar">
        <button id="btnShow" class="btn success">SHOW LIVE</button>
        <button id="btnEdit" class="btn primary">EDIT MODE</button>
        <button id="btnClear" class="btn warning">CLEAR TEXT</button>
        <button id="btnBlack" class="btn danger">BLACK SCREEN</button>
      </div>

      <!-- Synchronized Song Part Triggers (INTRO, VERSE, CHORUS, etc.) -->
      <label class="section-label">Song Parts (Synced Trigger):</label>
      <div id="songPartTriggers" class="parts-grid">
        <!-- Dynamic part buttons will show here -->
      </div>

      <!-- Dual Text Editors for Active Part -->
      <div class="editors-grid">
        <div class="editor-box">
          <label class="section-label">Main Projector Editor:</label>
          <textarea id="activeMainInput" rows="5" placeholder="Projector text..."></textarea>
        </div>
        <div class="editor-box">
          <label class="section-label">Band / CP Editor (Chords/Notes):</label>
          <textarea id="activeBandInput" rows="5" placeholder="Band screen text with chords..."></textarea>
        </div>
      </div>
    </div>

    <!-- RIGHT PANEL: Dual Monitor Previews -->
    <div class="right-panel">
      <!-- Top Right: Main Landscape Monitor -->
      <div class="monitor-card">
        <div class="monitor-title">Main Monitor (Projector)</div>
        <div id="mainPreview" class="preview-screen landscape">
          <div class="preview-text"></div>
        </div>
      </div>

      <!-- Bottom Right: Portrait Mobile/CP Monitor -->
      <div class="monitor-card">
        <div class="monitor-title">Portrait CP Monitor</div>
        <div id="mobilePreview" class="preview-screen portrait">
          <div class="preview-text"></div>
        </div>
      </div>
    </div>

  </div>

  <script src="app.js"></script>
</body>
</html>
