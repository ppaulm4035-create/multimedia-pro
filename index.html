<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multimedia Presenter</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <!-- Top Toolbar -->
        <header class="top-toolbar">
            <h2>Multimedia Presenter</h2>
            <div class="action-buttons">
                <button id="btnClear" class="btn warning">Clear</button>
                <button id="btnBlack" class="btn dark">Blackout</button>
            </div>
        </header>

        <!-- 3-Column Studio Workspace -->
        <div class="workspace">
            <!-- Left Column: Templates -->
            <div class="templates-sidebar">
                <h3>Templates</h3>
                <div id="templateBar" class="template-list"></div>
            </div>

            <!-- Center Column: Editing Screen (Main) -->
            <div class="editor-section">
                <div class="mode-label">EDITING SCREEN (MAIN)</div>
                <div class="canvas-box">
                    <textarea id="centerEditor" class="editor-input" placeholder="Type or paste slide content here..."></textarea>
                </div>
            </div>

            <!-- Right Column: Clean Live Monitors (Walang anumang labels, purong screen lang) -->
            <div class="preview-panel">
                <div class="canvas-box live-box-small">
                    <div id="livePreviewBox" class="editor-output live-text-small"></div>
                </div>
                <div class="canvas-box portrait-box-large">
                    <div id="portraitPreviewBox" class="editor-output portrait-text-large">Portrait Screen</div>
                </div>
            </div>
        </div>
    </div>

    <!-- PowerPoint-style Custom Context Menu -->
    <div id="contextMenu" class="custom-context-menu" style="display: none;">
        <div class="menu-item" id="ctxNew">➕ New Slide</div>
        <div class="menu-item" id="ctxDuplicate">📋 Duplicate Slide</div>
        <div class="menu-item delete-item" id="ctxDelete">🗑️ Delete Slide</div>
    </div>

    <script src="app.js"></script>
</body>
</html>
